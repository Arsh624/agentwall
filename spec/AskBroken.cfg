\* The bug: the timeout denies the call but leaves the question open, so the call
\* can get a second reply (another timeout, or a late "accept" that forwards it).
\* TLC must report that OneReply is violated (spec/check.sh fails otherwise).
CONSTANTS
    r1 = r1
    Reqs = {r1}
    ClearOnTimeout = FALSE

SPECIFICATION Spec
CONSTRAINT Bounded
INVARIANTS TypeOK OneReply
