\* The bug: an answer reaches the agent before its taint is recorded.
\* TLC must report that NoLeak is violated (spec/check.sh fails otherwise).
CONSTANTS
    issues = issues
    files = files
    web = web
    pr = pr
    UntrustedSrc = {issues, web}
    PrivateSrc = {files}
    EgressSink = {web, pr}
    TaintFirst = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK NoLeak
