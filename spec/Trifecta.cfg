\* The real design: NoLeak must hold in every interleaving.
\* Servers: issues (untrusted), files (private), web (untrusted + egress, like fetch), pr (egress).
CONSTANTS
    issues = issues
    files = files
    web = web
    pr = pr
    UntrustedSrc = {issues, web}
    PrivateSrc = {files}
    EgressSink = {web, pr}
    TaintFirst = TRUE

SPECIFICATION Spec
INVARIANTS TypeOK NoLeak TaintCoversSeen
